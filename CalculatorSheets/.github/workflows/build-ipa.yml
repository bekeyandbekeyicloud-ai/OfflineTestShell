name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Inject private sheet configuration
        env:
          SHEETS_ENDPOINT: ${{ secrets.CALCULATOR_SHEETS_ENDPOINT }}
          SHEETS_ACCESS_KEY: ${{ secrets.CALCULATOR_SHEETS_ACCESS_KEY }}
        run: |
          test -n "$SHEETS_ENDPOINT"
          test -n "$SHEETS_ACCESS_KEY"
          perl -0pi -e 's|__SHEET_ENDPOINT__|$ENV{SHEETS_ENDPOINT}|g; s|__SHEET_ACCESS_KEY__|$ENV{SHEETS_ACCESS_KEY}|g' App/SheetEditorModel.swift
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project Calculator.xcodeproj -scheme Calculator \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          test -d build/Build/Products/Release-iphoneos/Calculator.app
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Calculator.app Payload/
          zip -qry Calculator.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Calculator-TrollStore-IPA
          path: Calculator.ipa
          if-no-files-found: error
