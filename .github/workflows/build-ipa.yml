name: Build TrollStore IPA

on:
  push:
    branches:
      - build/ios-shell
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project OfflineTestShell.xcodeproj \
            -scheme OfflineTestShell \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/OfflineTestShell.app"
          test -d "$APP"
          codesign --force --sign - "$APP" || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry OfflineTestShell.ipa Payload
          ls -lh OfflineTestShell.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTestShell-IPA
          path: OfflineTestShell.ipa
          if-no-files-found: error
